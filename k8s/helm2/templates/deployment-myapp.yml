apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-myapp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monchart.labels" . | nindent 4 }}

spec:
  replicas: {{ required ".Values.replicaCount entry is required!" .Values.replicaCount }}

  selector:
    matchLabels:
      app: MyApp
      tier: frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
     maxUnavailable: 25%

  template:
    metadata:
      labels:
        app: MyApp
        tier: frontend

    spec:
      containers:
      - name: myapp-container
        image: {{ required ".Values.image.repository entry is required!" .Values.image.repository }}:{{ required ".Values.image.tag entry is required!" .Values.image.tag }}

        envFrom:
          - configMapRef:
              name: configmap-myapp
          - secretRef:
              name: secret-myapp

        resources:
          requests:
            memory: "{{ required ".Values.ressourceRequest.memory entry is required!" .Values.ressourceRequest.memory }}"
            cpu: "{{ required ".Values.ressourceRequest.cpu entry is required!" .Values.ressourceRequest.cpu }}"
            ephemeral-storage: "{{ required ".Values.ressourceRequest.ephemeralStorage entry is required!" .Values.ressourceRequest.ephemeralStorage }}"
          limits:
            memory: "{{ required ".Values.ressourceLimit.memory entry is required!" .Values.ressourceLimit.memory }}"
            cpu: "{{ required ".Values.ressourceLimit.cpu entry is required!" .Values.ressourceLimit.cpu }}"
            ephemeral-storage: "{{ required ".Values.ressourceLimit.ephemeralStorage entry is required!" .Values.ressourceLimit.ephemeralStorage }}"

        startupProbe:
          tcpSocket:
            port: 80
          failureThreshold: 12
          periodSeconds: 10

        livenessProbe:
          tcpSocket:
            port: 80
          periodSeconds: 60
          failureThreshold: 1
          initialDelaySeconds: 0

        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 10
          failureThreshold: 3
          initialDelaySeconds: 0
          timeoutSeconds: 5
