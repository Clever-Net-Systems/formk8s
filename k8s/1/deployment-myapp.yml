apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-myapp
  namespace: <prenom>-test2

spec:
  replicas: 3

  selector:
    matchLabels:
      app: MyApp
      tier: frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
     maxUnavailable: 25%

  template:
    metadata:
      labels:
        app: MyApp
        tier: frontend

    spec:
      containers:
      - name: myapp-container
        image: nginxdemos/hello:latest