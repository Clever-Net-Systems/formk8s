# Le tier backend n'est joignable que depuis l'INTERIEUR du cluster : le proxy
# du frontend l'appelle par le nom DNS de ce Service, qui resout vers son
# ClusterIP. Il n'est pas expose sur les noeuds.
#
# Pour le tester directement depuis un poste de travail :
#   kubectl port-forward svc/service-backend-clusterip 8080:80
#   puis http://localhost:8080/reports/
apiVersion: v1
kind: Service
metadata:
  name: {{ include "monchart.backendServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monchart.labels" . | nindent 4 }}
    tier: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: http
  selector:
    app: {{ required ".Values.appName entry is required!" .Values.appName }}
    tier: backends
