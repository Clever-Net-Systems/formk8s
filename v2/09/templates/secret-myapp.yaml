# Secret applicatif. "stringData" permet d'ecrire la valeur en clair dans le
# template : Kubernetes se charge de l'encodage base64.
# Rappel : base64 n'est PAS du chiffrement (kubectl get secret -o yaml).
apiVersion: v1
kind: Secret
metadata:
  name: secret-myapp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monchart.labels" . | nindent 4 }}
type: Opaque
stringData:
  PASSWD: "{{ required ".Values.password entry is required!" .Values.password }}"
